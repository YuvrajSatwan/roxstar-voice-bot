services:
  # 1. Backend Web Service: Token server on $PORT + LiveKit worker
  - type: web
    name: roxstar-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python run_sts.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STS_MODEL
        value: gemini-3.8-live
      - key: STS_VOICE
        value: Leda

  # 2. Frontend Static Site: React UI with Vite
  - type: web
    name: roxstar-frontend
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The browser needs the backend's PUBLIC URL.
      # Replace roxstar-backend with your actual Render service URL once assigned by Render
      - key: VITE_TOKEN_URL
        value: https://roxstar-backend.onrender.com
